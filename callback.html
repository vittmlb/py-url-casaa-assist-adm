<!DOCTYPE html>
        2 <html lang="pt-BR">
        3 <head>
        4   <meta charset="UTF-8" />
        5   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        6   <title>Tiny API — Autorização</title>
        7   <style>
        8     * { box-sizing: border-box; margin: 0; padding: 0; }
        9     body {
       10       font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
       11       background: #f4f4f5;
       12       display: flex;
       13       align-items: center;
       14       justify-content: center;
       15       min-height: 100vh;
       16       padding: 24px;
       17     }
       18     .card {
       19       background: #fff;
       20       border-radius: 12px;
       21       box-shadow: 0 2px 16px rgba(0,0,0,0.10);
       22       padding: 40px;
       23       max-width: 520px;
       24       width: 100%;
       25       text-align: center;
       26     }
       27     .icon { font-size: 48px; margin-bottom: 16px; }
       28     h1 { font-size: 22px; color: #111; margin-bottom: 8px; }
       29     p  { font-size: 15px; color: #555; margin-bottom: 24px; }
       30     .code-box {
       31       background: #f0fdf4;
       32       border: 1.5px solid #86efac;
       33       border-radius: 8px;
       34       padding: 16px;
       35       font-family: monospace;
       36       font-size: 14px;
       37       word-break: break-all;
       38       color: #166534;
       39       margin-bottom: 20px;
       40       text-align: left;
       41     }
       42     .btn {
       43       background: #16a34a;
       44       color: #fff;
       45       border: none;
       46       border-radius: 8px;
       47       padding: 12px 28px;
       48       font-size: 15px;
       49       cursor: pointer;
       50       transition: background 0.2s;
       51     }
       52     .btn:hover { background: #15803d; }
       53     .btn.copied { background: #6b7280; }
       54     .error-box {
       55       background: #fef2f2;
       56       border: 1.5px solid #fca5a5;
       57       border-radius: 8px;
       58       padding: 16px;
       59       color: #991b1b;
       60       font-size: 14px;
       61       margin-bottom: 20px;
       62     }
       63     .note {
       64       margin-top: 24px;
       65       font-size: 13px;
       66       color: #9ca3af;
       67     }
       68   </style>
       69 </head>
       70 <body>
       71   <div class="card" id="app"></div>
       72
       73   <script>
       74     const params = new URLSearchParams(window.location.search);
       75     const code   = params.get("code");
       76     const error  = params.get("error");
       77     const app    = document.getElementById("app");
       78
       79     if (code) {
       80       app.innerHTML = `
       81         <div class="icon">✅</div>
       82         <h1>Autorização concluída</h1>
       83         <p>Copie o código abaixo e cole no terminal onde o script está aguardando.</p>
       84         <div class="code-box" id="code">${code}</div>
       85         <button class="btn" onclick="copyCode()">Copiar código</button>
       86         <p class="note">Após colar no terminal, você pode fechar esta aba.</p>
       87       `;
       88     } else if (error) {
       89       app.innerHTML = `
       90         <div class="icon">❌</div>
       91         <h1>Erro na autorização</h1>
       92         <div class="error-box">${error}</div>
       93         <p>Feche esta aba e tente novamente.</p>
       94       `;
       95     } else {
       96       app.innerHTML = `
       97         <div class="icon">⚠️</div>
       98         <h1>Nenhum código recebido</h1>
       99         <p>Esta página deve ser acessada via redirecionamento do Tiny ERP.</p>
      100       `;
      101     }
      102
      103     function copyCode() {
      104       const code = document.getElementById("code").innerText;
      105       navigator.clipboard.writeText(code).then(() => {
      106         const btn = document.querySelector(".btn");
      107         btn.textContent = "Copiado!";
      108         btn.classList.add("copied");
      109         setTimeout(() => {
      110           btn.textContent = "Copiar código";
      111           btn.classList.remove("copied");
      112         }, 2000);
      113       });
      114     }
      115   </script>
      116 </body>
      117 </html>
